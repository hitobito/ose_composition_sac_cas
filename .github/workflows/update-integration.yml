name: Update Integration

on:
  workflow_dispatch:
    inputs:
      target_branch:
        type: string
        description: Release a specific branch of the core and wagons. Leave empty for intelligent defaults.
        required: false
  schedule: 
    # Github schedules are delayed by several hours as of 10-2026, so the defined time is earlier than the intended run time.
    - cron: 10 0 * * 1-5
      timezone: 'Europe/Berlin'

jobs:
  release:
    uses: hitobito/hitobito/.github/workflows/release.yml@master
    with:
      composition: ${{ github.repository }}
      release_type: regular
      stage: integration
      target_branch: ${{ inputs.target_branch }}
    secrets: inherit
